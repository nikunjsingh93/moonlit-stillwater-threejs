<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060a0d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<title>Moonlit Stillwater — Swamp Boat Ride</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="ui">
  <div id="brand">MOONLIT STILLWATER</div>
  <div id="hint">W/S throttle &middot; A/D steer &middot; C cabin &middot; V boat &middot; drag to look &middot; R reset &middot; click for sound</div>
  <div id="loc"><div id="locKicker">EXPLORING MOONLIT STILLWATER</div><div id="locName">Cypress Cathedral</div></div>
  <div id="btns"><button id="cabinBtn">cabin</button><button id="boatBtn">airboat</button><button id="eveningBtn">night mode</button><button id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 7 H20 M4 12 H20 M4 17 H20"/></svg></button></div>
  <div id="menu"><label>GRAPHICS <select id="quality" aria-label="graphics quality"><option value="ultra">ultra</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select></label><label>SOUND <button id="muteBtn">mute</button></label></div>
  <div id="touch">
    <div class="tgroup">
      <button id="tLeft" aria-label="steer left"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg></button>
      <button id="tRight" aria-label="steer right"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg></button>
    </div>
    <div class="tgroup">
      <button id="tBrake" aria-label="brake"><svg viewBox="0 0 24 24"><path d="M5 9 L12 16 L19 9"/></svg></button>
      <button id="tGas" aria-label="throttle"><svg viewBox="0 0 24 24"><path d="M5 15 L12 8 L19 15"/></svg></button>
    </div>
  </div>
</div>
<canvas id="scene"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
